<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bloom Circuit</title>
<style>
  /* Fredoka (Google Fonts, SIL OFL 1.1) — 가변 서체 latin 서브셋만 self-host(29.7KB, 외부 요청 0). font-display:swap 이라
     서체 도착 전에도 시스템 서체로 «즉시» 그려진다(빈 글자 구간 없음). */
  @font-face{font-family:"Fredoka";font-style:normal;font-weight:600 700;font-display:swap;
    src:url(./fonts/fredoka-600-700-latin.woff2) format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  :root{
    color-scheme:dark;
    --bg:#04161c;--ink:#effff8;--dim:#9fc4b8;--faint:#6f9188;
    --panel:rgba(8,32,39,.9);--panel2:rgba(10,40,47,.72);
    --line:rgba(176,255,221,.16);--line2:rgba(176,255,221,.3);
    --mint:#79f2bd;--mint2:#38cda2;--gold:#ffd166;--coral:#ff7a85;--violet:#c3a4ff;--sky:#8ae6ff;
    /* 그래픽 고도화(2026-08-30) DESIGN.md §6 — 디스플레이 서체(숫자·영문·버튼). 한글은 unicode-range 밖이라 시스템 고딕 폴백. */
    --display:"Fredoka",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    --card:#0f2b22;
    --r1:14px;--r2:20px;--r3:28px;
    --ease:cubic-bezier(.22,.8,.28,1);
    /* 트랙K(2026-08-05) Partner 실행승인 — 안전영역 상단 클램프. 불투명 네비바
       (insets.top 59 + navbar 44 = 103css 검은 띠)에 웹뷰 --sa-top 59css 가
       또 비워져 162css 이중 계상 — "헤드가 길게 빈다"의 실체. SDK(src/toss/
       safeArea.ts)가 --sa-top 을 documentElement 에 «인라인»으로 꽂으므로
       !important 없이는 이 클램프가 무효(인라인이 :root 선언보다 특정도가
       높다) — 반드시 !important 유지.
       ★ !important 는 «상단만»이다. 회전·폴더블로 상단 인셋이 바뀌어도 12
       고정인데, 검은 띠가 이미 노치를 덮고 있으므로 그게 맞는 동작이다.
       ★ 나중에 transparentBackground:true 로 가면 웹뷰가 띠 밑까지 올라오
       므로 이 !important 를 걷어내고 «실제 인셋»을 써야 한다. */
    --sa-top:12px !important;
    --safeT:var(--sa-top, env(safe-area-inset-top,0px));--safeB:var(--sa-bottom, env(safe-area-inset-bottom,0px));
    --safeL:var(--sa-left, env(safe-area-inset-left,0px));--safeR:var(--sa-right, env(safe-area-inset-right,0px));
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
    /* 트랙K 3차수정(2026-08-04): iOS/WKWebView 의 자동 텍스트 확대(text autosizing,
       일명 font boosting)를 끈다. 선언이 없으면 기본값 auto 라 WebKit 이 «임의로»
       글자를 키운다 — Chromium 헤드리스엔 이 동작이 없어서 "실기기에서만 잘리고
       헤드리스로는 재현이 안 되는" 이 프로젝트의 반복 증상과 성질이 같다.
       100% 로 고정하면 clamp() 로 설계한 크기가 기기에서 그대로 나온다.
       [가설 — 실기기 확인 필요. 단, 이번 수정의 «안 잘림» 보장은 이 선언이 아니라
        아래 .card / .titleStats 의 구조 변경이 담당한다. 이건 보조 장치다.] */
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    /* 트랙K 긴급수정(2026-08-03): -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo" 선두
       추가. President 실기기(iOS)에서 버튼 텍스트가 잘리는 사고가 났는데, 원래 스택엔 iOS
       표준 폰트가 전혀 없어 iOS가 어떤 폴백 폰트로 떨어지는지가 불확실했다(헤드리스
       Chromium/WebKit 재현 실패 — 실제 iOS 폰트 매칭과 다름). Apple SD Gothic Neo는 한글
       메트릭이 검증된 iOS 기본 산세리프다. [가설 수정 — 알려진 안티패턴 제거, 실기기 확인 필요] */
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Inter,ui-rounded,"Segoe UI","Noto Sans CJK KR","Noto Sans JP","Yu Gothic",Meiryo,"Malgun Gothic",Arial,sans-serif;
    touch-action:none;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
  /* keep-all stops Korean particles orphaning, but it would stop Japanese and
     Chinese from wrapping at all — those scripts break between characters. */
  /* !important is required: component rules such as ".node .nd" carry higher
     specificity than this language override, so without it Japanese text kept
     word-break:keep-all, never wrapped, and blew the lab grid past its column. */
  html[lang="ja"],html[lang="ja"] *{word-break:normal!important;line-break:normal!important}
  #wrap{position:fixed;inset:0;overflow:hidden;background:#04161c}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- buttons ---------- */
  /* 트랙K 긴급수정(2026-08-03): line-height:1 -> 1.4. 한글은 라틴 문자보다 위아래로
     더 차지해서(받침·모음) line-height:1은 그 자체가 버그다 — President 스크린샷의
     "플레이" 세로 잘림과 증상이 정확히 일치한다. [가설 수정 — 알려진 안티패턴 제거,
     실기기 확인 필요. 헤드리스로는 재현 못 했다(Chromium/WebKit 둘 다 정상 렌더)]. */
  button{font-family:inherit;border:1px solid var(--line);background:rgba(7,29,36,.84);color:var(--ink);
    border-radius:999px;font-weight:800;font-size:clamp(13px,1.7vmin,16px);line-height:1.4;padding:.8em 1.1em;
    min-height:44px;cursor:pointer;transition:transform .16s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease),opacity .2s}
  button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--line2);box-shadow:0 6px 14px rgba(0,0,0,.32)}
  button:active:not(:disabled){transform:translateY(0) scale(.97)}
  button:disabled{opacity:.42;cursor:default}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .primary{font-family:var(--display);border:0;background:linear-gradient(135deg,#8dfbc8,#2fbf95);color:#04231c;
    box-shadow:0 10px 24px rgba(2,14,12,.45),inset 0 1px 0 rgba(255,255,255,.35);font-size:clamp(15px,2.2vmin,20px);padding:1em 2em;font-weight:700;letter-spacing:0}
  .primary:hover:not(:disabled){box-shadow:0 14px 30px rgba(2,14,12,.55),inset 0 1px 0 rgba(255,255,255,.35)}
  .ghost{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12)}
  .gold{border:0;background:linear-gradient(135deg,#ffe08a,#f2a93b);color:#37220a;box-shadow:0 10px 24px rgba(2,14,12,.45)}
  /* ★2026-08-22 backdrop-filter 제거(Chief/Partner 지시, 실측 -19.9ms/frame —
     4종 중 유일하게 60fps 예산 16.7ms 를 통째로 넘김). 게임 중 상시노출 아이콘
     버튼(#pauseBtn)이 실시간 GPU 블러 대상이었다. 같은 자리·같은 모양·같은
     테두리를 유지한 채 블러만 뺐다 — 불투명도를 .7->.94 로 올려 블러가 만들던
     "뒤가 거의 안 비치는" 인상을 그대로 재현한다(대체: 반투명 단색 + border,
     Partner 지시). 실시간 블러 자체가 문제지 look 이 문제가 아니다. */
  .iconBtn{min-width:44px;min-height:44px;padding:0;display:grid;place-items:center;border-radius:14px;
    background:rgba(4,24,29,.94)}

  /* ---------- language ---------- */
  .langRow{display:flex;gap:2px;flex-wrap:nowrap;justify-content:center;padding:4px;border:1px solid var(--line);
    border-radius:14px;background:rgba(4,24,29,.86);max-width:100%;
    overflow-x:auto;scrollbar-width:none}
  .langRow::-webkit-scrollbar{display:none}
  .lang-btn{flex:1 1 auto;min-width:32px;min-height:36px;border:1px solid transparent;background:transparent;color:#9dbfb3;
    border-radius:10px;padding:6px 4px;font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:0}
  .lang-btn:hover{color:var(--ink);background:rgba(255,255,255,.08);transform:none;box-shadow:none}
  .lang-btn.active{color:#05251e;background:linear-gradient(135deg,var(--gold),var(--mint));box-shadow:0 3px 8px rgba(0,0,0,.35)}

  /* ---------- screens ---------- */
  /* Menus float over the live garden canvas — keep the scrim light so the
     season, weather and flowers stay visible behind the cards. */
  .screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    padding:calc(14px + var(--safeT)) calc(14px + var(--safeR)) calc(14px + var(--safeB)) calc(14px + var(--safeL));
    background:radial-gradient(90% 62% at 50% 42%,rgba(3,18,24,.62) 0%,rgba(3,18,23,.34) 62%,rgba(3,16,21,.18) 100%);
    /* ★ 2026-08-05 backdrop-filter 원복(Partner). 한때 「타일 페인트 실패」 가설로
       제거 실험을 준비했으나, 픽셀 재측정에서 증상이 «레이아웃 41% 압축»(구분자 간격
       205.0 -> 84.5px)으로 확정돼 그 가설이 반증됐다. 페인트/합성 속성은 레이아웃
       폭을 줄이지 못한다. 지금 발송본은 폰에 깔린 20260805-9 와 «단 한 가지»
       (.titleStats 의 max-width:34ch 제거)만 달라야 하므로 흐림을 되살린다. */
    transition:opacity .3s var(--ease),transform .3s var(--ease);overflow:hidden}
  /* 트랙K 5차수정(2026-08-04) — 카드형 화면: «넘치면 스크롤, 안 넘치면 가운데».
     ── 사고(칩 재검증에서 잡힘) ─────────────────────────────────────────
     타이틀 칩은 4차 수정(flex-wrap) 이후 «가로»로는 어떤 조합에서도 안 잘린다
     (라벨 렌더폭 == 자연폭, 카드 가로 넘침 0 — 96케이스 실측). 그런데 OS 글자
     배율을 올리면 «세로»가 터졌다. 390x844 / KO / 배율 2.0 실측:
       클리어 칩의 값 24/24 가 카드 아래 경계에서 잘리고,
       정수 99999 칩과 플레이·정원지도·온실연구소·플레이방법·소리 버튼이
       통째로 사라진다 = 게임을 시작할 수단이 없다.
     ── 원인 ────────────────────────────────────────────────────────────
     .screen 은 flex-direction:column 이고 카드는 flex 아이템이다. flex 아이템의
     기본값 flex-shrink:1 때문에 카드는 «내용보다 낮게» 찌그러지고, .card 의
     overflow:hidden(:before 궤도 그라디언트를 가두려고 걸어둔 것)이 넘친
     내용을 잘라낸다. justify-content:center 라 스크롤도 불가능하다
     (가운데 정렬 + overflow 는 위쪽이 아예 도달 불가인 고전 함정).
     ── 고침 ────────────────────────────────────────────────────────────
     1) justify-content:center 대신 첫 자식 margin-top:auto / 마지막 자식
        margin-bottom:auto 로 가운데를 만든다. auto 마진은 «넘칠 때 0 으로
        풀려서» 스크롤이 정상 동작한다 — center 는 안 풀린다. 안 넘칠 때의
        렌더는 center 와 동일하다(배율 1.0/1.3 회귀 없음, 실측 48/48 동일 —
        ★ 라벨(2026-08-05, venture-secretary): 1.3 수치는 이후 결함이 확인된
        동일 계열 배율 시뮬레이터(html 선-확대 후 em/rem 자식 재측정 → 복합
        팽창)로 잰 값이라 헤드리스 추정으로만 취급한다. 1.0 수치는 배율
        시뮬레이션이 아니라 실제 뷰포트 실측이라 유효하다. 실기기 재확인
        전까지 이 문단 전체를 「해결 확정」으로 인용하지 말 것).
     2) flex:0 0 auto 로 카드가 내용보다 낮아지는 것 자체를 막는다.
     3) overflow-y:auto + touch-action:pan-y 로 넘치면 손가락으로 볼 수 있게.
     #scTut 는 인라인 style="justify-content:center" 가 있었는데 인라인이
     이 규칙을 이겨서 같은 함정에 남으므로 마크업에서 제거했다. */
  #scTitle,#scResult,#scPause,#scTut{justify-content:flex-start;overflow-y:auto;
    overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  #scTitle>*,#scResult>*,#scPause>*,#scTut>*{flex:0 0 auto}
  #scTitle>*:first-child,#scResult>*:first-child,#scPause>*:first-child,#scTut>*:first-child{margin-top:auto}
  #scTitle>*:last-child,#scResult>*:last-child,#scPause>*:last-child,#scTut>*:last-child{margin-bottom:auto}
  #scMap,#scLab{background:linear-gradient(180deg,rgba(3,20,26,.62) 0%,rgba(3,16,21,.8) 40%,rgba(2,12,16,.88) 100%)}
  .screen.hidden{opacity:0;pointer-events:none;transform:scale(.985)}
  .scroller{width:100%;max-width:1060px;overflow-y:auto;overflow-x:hidden;flex:1;touch-action:pan-y;
    scrollbar-width:thin;padding:2px 2px 26px;-webkit-overflow-scrolling:touch}
  .scroller::-webkit-scrollbar{width:6px}
  .scroller::-webkit-scrollbar-thumb{background:rgba(121,242,189,.25);border-radius:6px}

  /* 트랙K 3차수정(2026-08-04): width:min(94vw,560px) -> width:100%;max-width:560px.
     vw 는 뷰포트 전체 폭이라 부모(.screen)의 좌우 패딩 calc(14px + safe-area) 을
     전혀 모른다. 그래서 카드는 «항상» 부모 콘텐트박스보다 넓다:
       사용가능 = 100vw - 28px - safeL - safeR   vs   카드 = 94vw
       430px 실측 → 402px 사용가능 / 404.19px 카드 (2.19px 초과)
     safe-area 가 0 이 아닌 기기·회전에서는 초과폭이 그만큼 더 커지고,
     .screen 은 overflow:hidden 이라 카드 오른쪽이 «잘려» 보인다. 카드 안의
     칩 줄은 카드 기준으로 가운데 정렬돼 있으므로 카드가 오른쪽으로 밀려
     잘리면 «세 번째 칩만 오른쪽에서 잘린» 것처럼 보인다 — President 실기기
     증상과 정확히 일치한다. width:100% 는 부모 콘텐트박스 기준이라 패딩과
     safe-area 를 자동으로 존중한다 = 구조적으로 넘칠 수 없다. */
  /* B6 (2026-08-22, art direction approved): the "dead space" audit finding
     was a false positive from viewing dist/web over file:// (CORS hides the
     background canvas there) — the sky/cloud/grass scene is present. The
     real issue is the panel reading as a generic dark-glass box floating
     over that scene. Fix is identity, not filling pixels: solid moss-green
     (#0f2b22, same family as the garden background) so the card feels like
     part of the garden, plus a brighter 1px inset top edge as a dew
     highlight. No backdrop-filter/blur here (never was on .card — B2 stays
     performance-lane territory untouched). */
  .card{position:relative;overflow:hidden;width:100%;max-width:560px;border-radius:var(--r3);
    padding:clamp(20px,4.4vmin,40px);text-align:center;
    /* 정적 이슬 하이라이트(위·왼쪽)를 배경 층으로 — 라이브의 16초 무한 회전 conic(:before) 은 GPU 를 계속 깨웠다 */
    background:radial-gradient(70% 42% at 28% -6%,rgba(121,242,189,.13),transparent 70%),var(--card);
    box-shadow:0 22px 48px rgba(0,0,0,.5),inset 0 1px rgba(220,255,238,.24)}
  .card>*{position:relative}

  /* B3 (2026-08-22, art direction approved): gradient-clip-text removed —
     decorative-never-meaningful per house style. CTA gradient (.primary,
     line ~68) is untouched; this is the title glyphs only. Solid --ink
     against the moss-green card (see .card below) measures 14.75:1. */
  h1{font-family:var(--display);margin:0;font-size:clamp(36px,7.4vmin,70px);line-height:1;letter-spacing:-.03em;font-weight:700;color:var(--ink);text-wrap:balance}
  /* 제목 «아래» 한 줄 부제(아이브로우 아님: 대문자·자간 없음). 문서 순서도 제목 다음이다. */
  .kicker{color:var(--dim);font-weight:700;letter-spacing:0;font-size:clamp(12.5px,1.8vmin,14.5px);margin:6px 0 0;word-break:keep-all}
  .kicker:empty{display:none}
  .desc{margin:16px auto 18px;color:#cfeade;line-height:1.62;font-size:clamp(13.5px,1.85vmin,17px);max-width:38ch;word-break:keep-all}
  h2.secTitle{font-family:var(--display);margin:0;font-size:clamp(20px,3.2vmin,30px);letter-spacing:-.02em;color:var(--ink);font-weight:700;text-wrap:balance}
  .secSub{margin:5px 0 0;color:var(--dim);font-size:clamp(11.5px,1.6vmin,14px);line-height:1.5;max-width:44ch;word-break:keep-all}

  /* ---------- title screen ---------- */
  #scTitle{gap:0}  /* 5차수정: justify-content 는 위 카드형 화면 규칙이 담당 */
  #titleCard{width:100%;max-width:520px;padding:clamp(15px,2.6vmin,30px) clamp(16px,3vmin,34px)}
  #titleCard h1{font-size:clamp(30px,6.4vmin,62px)}
  #titleCard .desc{margin:11px auto 13px;max-width:34ch;font-size:clamp(12.5px,1.7vmin,16px);line-height:1.5}
  /* 트랙K 4차수정(2026-08-04) — 3차(grid 2열 고정)를 «되돌린다». 3차가 버그였다.
     ── 3차가 만든 실기기 증상 ────────────────────────────────────────────

  /* ---------- attendance overlay (2026-08-23, President 지적 대응) ---------- */
  /* 지적 원문: 「출석 보상을 이 홈 «위»에다가 플로팅으로 띄워야지.. 그거만 따로
     노출되니까 부자연스럽잖아.」
     ── 원인(실측) ────────────────────────────────────────────────────────
     #scAttend 가 «.screen» 이었다. setScreen() 은 SCREENS 전체를 돌며
     `classList.toggle("hidden", k!==s)` 를 하므로, setScreen("attend") 하는
     순간 #scTitle 이 hidden(opacity:0) 이 된다 = 홈이 «대체»된다. 부팅하면
     이어하기·정원지도·온실연구소·플레이방법·소리·KO/EN·개인정보처리방침이
     통째로 사라지고 출석 카드 하나만 남았다.
     ★부수 피해까지 있었다: src/startBanner.ts 의 isTitleNow() 가 #scTitle 의
       hidden 여부로 판정하므로, 출석 화면이 떠 있는 동안 «상·하단 배너가 아예
       붙지 않았다»(BEFORE 실측: start-ad-top/bottom 둘 다 DOM 부재).
     ── 고침 ──────────────────────────────────────────────────────────────
     .screen 을 떼고 홈 «위»에 뜨는 오버레이로 만든다. #scTitle 은 계속 보이고
     배너도 정상적으로 붙는다.
     ── z-index (의미 계층) ───────────────────────────────────────────────
       0/1/6/7/8  게임 내부 레이어
       10         .screen (홈/지도/연구소/결과/일시정지/튜토리얼)
       11         시작화면 상·하단 배너 (src/startBanner.ts)
       30         ★출석 오버레이 = 이 블록
       99999      종료 확인 모달 (src/exitConfirmUi.ts)
     ── ⛔backdrop-filter 를 쓰지 않는다 ──────────────────────────────────
     뒤의 .screen 이 이미 blur(1.5px) saturate(1.06) 를 한 장 걸고 있다(95행).
     여기 한 장 더 얹으면 같은 픽셀에 실시간 블러가 «2중»으로 걸린다. 이
     게임은 draw 비용 최악 실측 이력이 있고(#pauseBtn backdrop-filter 실측
     -19.9ms/frame 으로 제거한 전례가 바로 위 68행 주석에 있다) 60fps 가 절대
     조건이다. 딤은 «단색 알파 한 장»으로만 만든다 — 합성 1레이어, 블러 0.
     ── 딤 강도 rgba(2,13,18,.58) 선택 근거 ───────────────────────────────
     이 값은 「홈이 보이되 비활성인 게 명확한」 지점이다. 더 옅게(.35) 가면
     홈 버튼과 오버레이 카드가 같은 밝기로 경쟁해 「무엇을 눌러야 하나」가
     흐려지고, 더 짙게(.75) 가면 President 지적의 「홈 위에」가 다시 무의미해진다.
     카드 자체는 불투명(#0f2b22)이라 딤 강도와 무관하게 본문 대비는 고정이다
     — 즉 이 값은 «가독성»이 아니라 «배경 가시성» 만 조절한다. */
  #scAttend{position:absolute;inset:0;z-index:30;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(14px + var(--safeT) + var(--atnTop,0px)) calc(14px + var(--safeR))
            calc(14px + var(--safeB) + var(--atnBot,0px)) calc(14px + var(--safeL));
    overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    background:rgba(2,13,18,.58)}
  /* 카드형 화면(#scTitle 등)과 «같은» 규율을 쓴다: 넘치면 스크롤, 안 넘치면
     가운데. auto 마진은 넘칠 때 0 으로 «풀려서» 스크롤이 되지만
     justify-content:center 는 안 풀린다(113행 주석의 그 함정). */
  #scAttend>*{flex:0 0 auto}
  #scAttend>*:first-child{margin-top:auto}
  #scAttend>*:last-child{margin-bottom:auto}
  /* ⛔opacity:0 이 아니라 display:none 이다. .screen.hidden 은 pointer-events:none
     이 같이 걸려 있어서 괜찮았지만 이건 .screen 이 아니다 — opacity 만 0 으로
     두면 홈 전체를 덮는 «투명한 터치 벽»이 남아 홈 버튼이 안 눌린다. */
  #scAttend.hidden{display:none}
  /* 열릴 때 포커스는 «다이얼로그 컨테이너»가 받는다(버튼이 아니라).
     - 버튼에 프로그램 포커스를 주면 터치로 열었는데도 키보드용 :focus-visible
       금색 링이 그려진다(헤드리스 실측으로 잡았다). 컨테이너는 그 규칙
       (button:focus-visible)의 대상이 아니라 링이 안 생기고, role="dialog" +
       aria-labelledby/describedby 라 스크린리더 안내는 오히려 더 정확하다.
     - 링 자체를 없애는 게 아니다: 탭 키로 #aClaim 에 가면 링은 정상적으로 뜬다. */
  #scAttend:focus{outline:none}
  /* 뒤에서 #titleCard 의 .card:before 궤도 그라디언트가 «이미» 무한 회전 중이다.
     오버레이 카드에서 한 장 더 돌리면 상시 애니메이션 합성 레이어가 2배가 된다.
     여기서는 끈다(카드 정체성은 배경색·테두리·그림자가 이미 만든다). */
  #aCard:before{content:none}
  /* 진입 모션: 스크림 페이드 + 카드가 살짝 올라온다. 150-250ms 대역, ease-out.
     ★fill-mode 를 «주지 않는다» — 애니메이션이 어떤 이유로든 안 돌아도(백그라운드
       탭·헤드리스·감속모드) 요소의 기본 렌더는 «이미 보이는» 상태다. 노출을
       transition/animation 에 의존시키면 그 화면이 통째로 빈 채로 출하된다. */
  @keyframes atnScrimIn{from{opacity:0}to{opacity:1}}
  @keyframes atnCardIn{from{opacity:0;transform:translateY(12px) scale(.972)}to{opacity:1;transform:none}}
  /* 스크림을 눌렀을 때의 응답. 장식이 아니라 «해야 할 일이 저기 있다»는 상태
     전달이다(iOS 시스템 얼럿과 같은 관용구). */
  @keyframes atnNudge{0%{transform:none}30%{transform:translateX(-6px)}62%{transform:translateX(6px)}100%{transform:none}}
  #scAttend{animation:atnScrimIn .18s var(--ease)}
  #aCard{animation:atnCardIn .26s var(--ease)}
  #aCard.nudge{animation:atnNudge .26s var(--ease)}
  @media(prefers-reduced-motion:reduce){
    /* 대안 = 즉시 표시(모션 없음). 스크림 탭 응답은 JS 가 #aClaim 에 포커스를
       옮기는 것으로 «모션 없이도» 남는다. */
    #scAttend,#aCard,#aCard.nudge{animation:none}
  }

  /* ---------- lab (upgrade tree) ---------- */
  /* content hugs the top of the scroll box: vertical centring left a large
     empty band under the header on tall desktop viewports */
  #scLab .scroller{display:flex;flex-direction:column;justify-content:flex-start}
  .branches{display:grid;grid-template-columns:1fr;gap:16px;align-items:start;width:100%}
  @media(min-width:720px){.branches{grid-template-columns:repeat(3,1fr);gap:14px}}
  .branch{position:relative;padding:12px 10px 4px;border-radius:var(--r2);border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(10,42,46,.72),rgba(5,24,30,.66))}
  .branch>h4{margin:0 0 10px;text-align:center;font-size:14px;font-weight:800;letter-spacing:0}
  .branch.b0>h4{color:var(--mint)}.branch.b1>h4{color:var(--gold)}.branch.b2>h4{color:var(--violet)}
  .node{position:relative;z-index:1;width:100%;display:block;text-align:left;margin-bottom:9px;padding:11px 12px 11px 40px;
    border-radius:var(--r1);background:#0a2b32;border:1px solid var(--line);min-height:auto}
  .node .dot{position:absolute;left:20px;top:16px}
  .node .nh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .node .nn{font-size:13.5px;font-weight:900;letter-spacing:-.01em;color:var(--ink);flex:1;min-width:0}
  .node .nc{font-family:var(--display);font-size:11.5px;font-weight:700;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
  .node .nd{font-size:11px;font-weight:600;color:var(--dim);line-height:1.42;word-break:keep-all}
  .node .ns{margin-top:6px;font-size:10.5px;font-weight:800;letter-spacing:0;color:var(--dim)}
  .node.owned{border-color:rgba(121,242,189,.45);background:linear-gradient(150deg,#175447,#0a2b32)}
  .node.owned .ns{color:var(--mint)}
  .node.owned .nc{display:none}
  .node.blocked{opacity:.45}
  .node.afford{border-color:rgba(255,209,102,.4);box-shadow:0 0 0 1px rgba(255,209,102,.12)}
  .node .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);flex:0 0 auto}
  .node.owned .dot{background:var(--mint);box-shadow:0 1px 3px rgba(0,0,0,.5)}

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;right:0;top:0;z-index:6;pointer-events:none;
    padding:calc(8px + var(--safeT)) calc(10px + var(--safeR)) 8px calc(10px + var(--safeL));
    transition:opacity .25s var(--ease)}
  #hud.hidden{opacity:0;pointer-events:none}
  .hudTop{display:flex;align-items:stretch;gap:7px;max-width:900px;margin:0 auto}
  .hudTop>*{pointer-events:auto}
  /* ★2026-08-22 backdrop-filter 제거(위 .iconBtn 과 동일 사유·동일 처방).
     코인/시간/날씨 칩 3개가 플레이 내내 상시노출되며 각자 블러를 걸고 있던
     것이 인스턴스 수의 절반을 차지했다(.stat×3). */
  .stat{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:7px 11px;border-radius:var(--r1);
    background:rgba(4,24,29,.93);border:1px solid var(--line)}
  .stat small{font-size:10px;font-weight:700;letter-spacing:0;color:var(--dim);white-space:nowrap}
  .stat b{font-family:var(--display);font-size:clamp(16px,2.3vmin,22px);font-weight:700;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  /* 코인 펀치 — 게임 js 가 코인 증가를 관찰해 punch/punch2 를 번갈아 붙인다(재트리거용 2개) */
  #vCoins{display:inline-block;transform-origin:left center}
  #vCoins.punch{animation:coinPunch .26s var(--ease)}
  #vCoins.punch2{animation:coinPunch2 .26s var(--ease)}
  @keyframes coinPunch{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
  @keyframes coinPunch2{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
  .stat.time b{font-variant-numeric:tabular-nums}
  .stat.time.warn b{color:#ff9b9b}
  .stat.wx{flex:1.6;overflow:hidden}
  .stat.wx b{font-size:clamp(11.5px,1.7vmin,14px);overflow:hidden;text-overflow:ellipsis}
  .stat.wx small{overflow:hidden;text-overflow:ellipsis}
  /* B7 (2026-08-22): was a single text node "▲1.21   ◈1.00" — now two
     icon+number items so growth/value read as distinct, legended stats
     instead of unexplained punctuation. */
  .stat.wx small.fx{display:flex;align-items:center;gap:9px;letter-spacing:.01em;text-transform:none;
    font-size:clamp(8.5px,1.25vmin,10.5px);font-variant-numeric:tabular-nums;overflow:visible}
  .wxFxItem{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
  .wxFxItem svg{width:.95em;height:.95em;flex:0 0 auto}
  .wxFxItem.wxFxGrow{color:var(--mint)}
  .wxFxItem.wxFxValue{color:var(--gold)}
  .goalRow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:900px;margin:7px auto 0}
  /* ★2026-08-22 backdrop-filter 제거(위와 동일 사유). 목표 칩은 stage.goals.length
     만큼 JS 로 동적 생성되고(최대 2~3개, 5·6장 주문서 칩까지 겹치면 최대 4개)
     겹칠수록 블러 인스턴스가 늘어나던 자리 — 인스턴스 수의 나머지 절반. */
  .goal{pointer-events:none;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
    background:rgba(4,24,29,.95);border:1px solid var(--line);
    font-size:clamp(10px,1.45vmin,12.5px);font-weight:800;color:#d9f2e7;max-width:100%;transition:.3s var(--ease)}
  .goal .gn{font-family:var(--display);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
  .goal.done{border-color:rgba(121,242,189,.55);background:rgba(20,74,64,.8);color:#dcffe9}
  .goal.done .gn{color:var(--mint)}
  /* ★2026-08-22 유니코드 체크마크(✓) 제거 -> SVG 마스크 아이콘(preflight_ait.py
     실코드 글리프 검사 FAIL, index.html 은 이 래핑 작업의 소유 영역이라 직접
     수정 가능 — B1(전임, SVG 잠금)과 같은 원칙을 여기 한 곳 놓친 것을 마저 맞춘다.
     원본 게임(public/game/bloom-circuit-game.js)의 ★ 2건은 게임 «콘텐츠»(별점
     UI)라 이 파일과 별개 — 원본 게임 파일 무편집 원칙 대상, 여기서 안 건드림). */
  .goal.done:after{content:"";display:inline-block;width:11px;height:11px;
    background-color:var(--mint);flex:0 0 auto;
    -webkit-mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>');
    mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>');
    -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  #chainTag{position:absolute;left:50%;transform:translateX(-50%) scale(.7);opacity:0;
    top:calc(100% + 7px);font-family:var(--display);font-weight:700;font-size:clamp(13px,2.1vmin,18px);color:#3a2408;
    padding:6px 15px;border-radius:999px;letter-spacing:0;
    background:linear-gradient(135deg,#ffe08a,#f5a623);
    box-shadow:0 6px 14px rgba(0,0,0,.4);
    white-space:nowrap;transition:.18s var(--ease)}
  #chainTag.on{opacity:1;transform:translateX(-50%) scale(1)}
  #chainTag.on.punch{animation:chainPunch .3s var(--ease)}
  @keyframes chainPunch{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.2)}100%{transform:translateX(-50%) scale(1)}}

  /* ---------- seed rail ---------- */
  #rail{position:absolute;left:0;right:0;bottom:0;z-index:6;
    padding:8px calc(8px + var(--safeR)) calc(8px + var(--safeB)) calc(8px + var(--safeL));
    transition:opacity .25s var(--ease)}
  #rail.hidden{opacity:0;pointer-events:none}
  /* fade the rail edges so it reads as a scrollable shelf of many seeds */
  #rail[data-scroll="1"] .railWrap{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%)}
  .railWrap{max-width:900px;margin:0 auto}
  .railInner{display:flex;gap:7px;overflow-x:auto;padding:3px;max-width:900px;margin:0 auto;
    justify-content:safe center;scrollbar-width:none;touch-action:pan-x;scroll-behavior:smooth}
  .railInner::-webkit-scrollbar{display:none}
  .seed{flex:0 0 auto;width:78px;min-height:78px;padding:7px 6px 8px;border-radius:16px;display:flex;flex-direction:column;
    align-items:center;gap:3px;background:linear-gradient(180deg,rgba(13,48,52,.86),rgba(5,26,32,.92));border:1px solid var(--line)}
  .seed .ico{width:34px;height:34px;background-size:contain;background-repeat:no-repeat;background-position:center;flex:0 0 auto}
  .seed .sn2{font-size:10px;font-weight:700;color:#d6efe4;line-height:1.15;text-align:center;height:2.3em;overflow:hidden;word-break:keep-all}
  .seed .sc{font-family:var(--display);font-size:11px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  .seed[data-on="1"]{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,209,102,.24),rgba(7,29,36,.94));
    box-shadow:0 0 0 2px rgba(255,209,102,.16),0 6px 14px rgba(0,0,0,.34)}
  .seed[data-poor="1"]{opacity:.44}
  .seed[data-poor="1"] .sc{color:var(--coral)}

  /* ---------- result ---------- */
  #resStars{display:flex;gap:10px;justify-content:center;margin:14px 0 6px}
  #resStars .st{transform:scale(0);transition:transform .42s var(--ease)}
  #resStars .st.pop{transform:scale(1)}
  .statRows{margin:16px 0 18px;display:flex;flex-direction:column;gap:1px;border-radius:var(--r1);overflow:hidden}
  .statRows div{display:flex;justify-content:space-between;gap:12px;padding:9px 13px;background:rgba(255,255,255,.045);
    font-size:clamp(12px,1.75vmin,14.5px)}
  .statRows span{color:var(--dim);font-weight:700}
  .statRows b{font-family:var(--display);color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  /* 결과 카드 연출 — opacity 는 건드리지 않는다(애니메이션이 안 돌아도 «이미 보이는» 상태). */
  #scResult:not(.hidden) .card{animation:cardPop .42s var(--ease)}
  #scResult:not(.hidden) .statRows div{animation:rowIn .38s var(--ease) backwards}
  #scResult:not(.hidden) .statRows div:nth-child(2){animation-delay:.05s}
  #scResult:not(.hidden) .statRows div:nth-child(3){animation-delay:.1s}
  #scResult:not(.hidden) .statRows div:nth-child(4){animation-delay:.15s}
  #scResult:not(.hidden) .statRows div:nth-child(5){animation-delay:.2s}
  #scResult:not(.hidden) .statRows div:nth-child(6){animation-delay:.25s}
  @keyframes cardPop{0%{transform:translateY(14px) scale(.96)}60%{transform:translateY(-2px) scale(1.01)}100%{transform:none}}
  @keyframes rowIn{from{transform:translateX(-10px)}to{transform:none}}
  .banner{margin:10px 0 0;padding:10px 14px;border-radius:var(--r1);font-size:clamp(11.5px,1.7vmin,14px);font-weight:800;
    background:linear-gradient(135deg,rgba(255,209,102,.2),rgba(121,242,189,.16));border:1px solid rgba(255,209,102,.3);color:#ffeec2;word-break:keep-all}
  .banner.hidden{display:none}
  .btnRow{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  .btnRow button{flex:1;min-width:120px}

  /* ---------- tutorial ---------- */
  #tutCard{width:100%;max-width:460px}
  .tutArt{height:112px;margin:2px 0 16px;border-radius:var(--r2);background:rgba(0,0,0,.22);
    border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}
  .tutArt canvas{width:100%;height:100%;display:block}
  .dots{display:flex;gap:6px;justify-content:center;margin:14px 0 16px}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:.3s var(--ease)}
  .dots i.on{background:var(--mint);width:20px;border-radius:4px}

  /* ---------- toast ---------- */
  /* snackbar above the seed rail so it never covers the board */
  #toast{position:absolute;z-index:8;left:50%;bottom:var(--toastB,86px);transform:translate(-50%,12px);opacity:0;
    padding:10px 18px;border-radius:999px;background:rgba(6,28,34,.95);border:1px solid rgba(255,209,102,.34);
    color:#ffe6a6;font-weight:900;font-size:clamp(12px,1.8vmin,15px);transition:.22s var(--ease);pointer-events:none;
    text-align:center;max-width:min(84vw,460px);word-break:keep-all;box-shadow:0 8px 14px rgba(0,0,0,.45)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #flash{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity .5s var(--ease);
    background:radial-gradient(60% 45% at 50% 45%,rgba(255,225,150,.4),transparent 70%)}
  #flash.on{opacity:1;transition:opacity .1s}

  @media(max-width:420px){
    .stat small{font-size:10px}
    .seed{width:70px}
    .statRows div{padding:8px 11px}
  }
  @media(max-height:560px) and (orientation:landscape){
    .card{padding:16px 20px}
    .desc{margin:10px auto 12px}
    .tutArt{height:74px}
    .seed{width:66px;min-height:66px}
    .seed .ico{width:26px;height:26px}
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.06s!important}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="Bloom Circuit garden board"></canvas>
  <!-- 그래픽 고도화(2026-08-30): 블룸 후처리 레이어(의존성 0). classic script — sdk-boot.ts(module, deferred)가 게임을
       동적 로드하기 «전»에 실행된다. WebGL 이 없으면 BloomPost.init 이 false 를 돌려주고 게임은 단일 캔버스 경로로 간다. -->
  <script src="./game/bloom-post.js"></script>

  <!-- ============ HUD ============ -->
  <div id="hud" class="hidden">
    <div class="hudTop">
      <button id="pauseBtn" class="iconBtn" aria-label="Pause game"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"></rect><rect x="14" y="4" width="5" height="16" rx="1.5"></rect></svg></button>
      <div class="stat"><small id="lCoins">Coins</small><b id="vCoins">0</b></div>
      <div class="stat time" id="timeStat"><small id="lTime">Time</small><b id="vTime">0</b></div>
      <div class="stat wx" id="wxStat"><small id="lWx">Weather</small><b id="vWx">-</b><small class="fx" id="vWxFx">-</small></div>
    </div>
    <div class="goalRow" id="goalRow"></div>
    <div id="chainTag"></div>
  </div>

  <!-- ============ seed rail ============ -->
  <div id="rail" class="hidden"><div class="railWrap"><div class="railInner" id="railInner" aria-label="Seed selection"></div></div></div>

  <div id="toast"></div>
  <div id="flash"></div>

  <!-- ============ title ============ -->
  <div id="scTitle" class="screen">
    <div class="card" id="titleCard">
      <div class="kicker" id="tKicker"></div>
      <h1 id="tTitle"></h1>
      <p class="desc" id="tTagline"></p>
      <div class="titleStats"><span class="tsItem"><span id="tStarLbl"></span> <b id="tStarVal">0</b></span> <span class="tsSep" aria-hidden="true">·</span> <span class="tsItem"><span id="tStageLbl"></span> <b id="tStageVal" class="tsMint">0</b></span> <span class="tsSep" aria-hidden="true">·</span> <span class="tsItem"><span id="tEssLbl"></span> <b id="tEssVal" class="tsViolet">0</b></span></div>
      <!-- 트랙K 긴급수정(2026-08-03): 정적 기본 라벨(한국어) 추가. 원래 전부 빈
           태그였고 JS(refreshTitle)가 100% 채웠다 — JS가 실패하면 영구 공백이던
           걸 실기기에서 겪었다. JS는 그대로 덮어쓰므로 언어전환 등 기존 동작은
           안 바뀐다. [가설 수정 — 실기기 확인 필요] -->
      <div class="titleBtns">
        <button class="primary" id="btnPlay">플레이</button>
        <div class="row2">
          <button class="ghost" id="btnMap">정원 지도</button>
          <button class="ghost" id="btnLab">온실 연구소</button>
        </div>
        <div class="row2">
          <button class="ghost" id="btnHow">플레이 방법</button>
        </div>
      </div>
      <!-- 트랙F 2차수정(2026-08-05): 언어·음악 설정을 제목 바로 아래(카드 상단)가
           아니라 «주 버튼들 아래»(카드 «안»)로 옮긴다. 1차수정(카드 상단 배치)은
           독립검증에서 «회귀로 관측»됐었다 — 배율 2.0 에서 설정 줄이 h1/태그라인/
           스탯 «위»에 얹혀 그만큼 아래 콘텐츠를 밀어내고, 그 결과 320~430폭 전
           구간에서 「플레이」 버튼이 스크롤 없이는 안 보이는 위치로 밀려난
           것으로 보였다(실측 9/48, 수정 전 원본 기준 5/48 대비).
           ★ 정정(2026-08-05, venture-secretary): 이 「회귀」 판정의 근거가 무효로
           확인됐다 — 당시 배율 시뮬레이션 하네스가 html 을 먼저 키운 뒤 그
           em/rem 자식을 다시 읽어 k 를 또 곱하는 복합 팽창 결함이 있었다
           (320x780/z2.0 실측: 기존 하네스 play_bottom=807 "안 보임" vs 수정판
           하네스 play_bottom=596 "보임", 211px 차). 수정판 하네스로는 재현되지
           않는다 — 원배치는 실제로는 기준을 위반한 적이 없었다.
           ★ 그렇다고 이 배치를 되돌리지는 않는다 — 현재 위치(카드 안, 주
           버튼들 다음)는 해롭지 않고 이미 검증됐다. 이 문단은 서술 정정일
           뿐이며, 카드 밖(화면 맨 아래)으로 되돌리지 않는 이유(President 제보
           원인)는 그대로 유효하다. 지금 위치는 원본과 마찬가지로 Play 가
           태그라인·스탯 바로 다음에 오므로 CTA 우선순위가 원본과 동일하게
           복원되고, 설정은 여전히 카드 밖으로 나가지 않아 스크롤 한 번이면
           항상 닿는다. -->
      <div class="titleSettings">
        <button class="ghost" id="btnSound" aria-label="Toggle sound">소리: 켜짐</button>
        <div class="langRow" id="langRow"></div>
      </div>
      <!-- ★2026-08-22 Partner 지시 — 개인정보처리방침 링크. 원본 게임 코드
           무접촉(래퍼 소유 영역, index.html)이라 이 위치에 새로 추가. 플레이
           영역·광고 지면(#ad-slots, 위쪽/아래쪽 배너)과 떨어진 카드 «안»
           설정 줄 다음(제목화면에서만 노출, 인접배치 아님). ko/en 텍스트는
           game.js 의 document.documentElement.lang 변화를 관측해서 반영한다
           (src/privacyLink.ts, game.js 는 1바이트도 안 건드림).
           ★2026-08-23 갱신 — 라이브 URL(404) → 번들 동봉으로 전환(Chief 지시,
           머니리그 레인 선례). public/privacy.html 이 vite publicDir 복사로
           dist 루트(=index.html 과 같은 위치)에 실린다. 상대경로라 같은
           오리진 내 네비게이션이고, openURL(SDK)은 「기기 기본 브라우저로

             ⚠️뒤로가기 복귀 시 게임 진행 상황이 보존되는지 실측할 것. -->
      <div class="privacyRow">

<script>
/* ★★ 2026-08-05 President 지시 — 타이틀 통산기록 줄을 «값이 확정된 뒤에만» 보인다.
   게임 JS(public/game/bloom-circuit-game.js)는 «무접촉»이다. 여기서만 처리한다.

   판별 기준: #tStarVal 에 «슬래시»가 들어왔는가.
     게임 JS 1138행: safeSet("tStarVal", () => totalStars()+"/"+(STAGES.length*3))
       → 실제 값은 항상 「N/72」 형태라 «반드시» 슬래시가 있다
     HTML 정적 기본값은 「0」 — 슬래시가 «없다»
     신규 유저도 「0/72」라 슬래시가 있다 → 기록 0 인 사람도 정상적으로 보인다
   즉 「슬래시 유무」가 «진짜 값»과 «아직 안 채워진 자리»를 정확히 가른다.
   숫자 크기나 타이머로 가르지 마라 — 0 이 정당한 값인 경우와 구분이 안 된다.

   해제되면 관찰을 멈춘다. 값이 다시 「0」으로 돌아가도 숨기지 않는다 —
   한 번 보인 줄이 사라지는 게 더 이상하다. */
(function () {
  var row = document.querySelector('.titleStats');
  var val = document.getElementById('tStarVal');
  if (!row || !val) { return; }
  function check() {
    if ((val.textContent || '').indexOf('/') === -1) { return false; }
    row.classList.add('tsReady');
    return true;
  }
  if (check()) { return; }
  var mo = new MutationObserver(function () { if (check()) { mo.disconnect(); } });
  mo.observe(val, { childList: true, characterData: true, subtree: true });
})();
</script>
